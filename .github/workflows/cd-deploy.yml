name: CD - Deploy to Production

on:
    push:
        branches: [main]

concurrency:
    group: production-deployment
    cancel-in-progress: false

jobs:
    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: "backend/package-lock.json"

            - name: Install and build backend
              run: |
                  cd backend
                  npm ci
                  npm run build

            - name: Run backend tests
              run: cd backend && npm run test -- --runInBand
              env:
                  NODE_ENV: test

            - name: Build backend Docker image
              run: |
                  docker build -f Dockerfile.backend \
                    -t gmao-backend:${{ github.sha }} \
                    -t gmao-backend:latest \
                    .

            - name: Verify Docker image
              run: docker run --rm gmao-backend:latest node --version

    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: "frontend/package-lock.json"

            - name: Resolve frontend API base URL
              run: |
                  if [ -z "$RAW_API_URL" ] && [ -f ".env.production" ]; then
                    RAW_API_URL=$(grep -E '^NEXT_PUBLIC_API_BASE_URL=' .env.production | tail -n 1 | cut -d'=' -f2- | tr -d '"' || true)
                  fi

                  if [ -z "$RAW_API_URL" ] && [ -f ".env.production" ]; then
                    RAW_API_URL=$(grep -E '^API_URL=' .env.production | tail -n 1 | cut -d'=' -f2- | tr -d '"' || true)
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    echo "::error::Missing frontend API URL. Configure one of: secrets.NEXT_PUBLIC_API_BASE_URL, secrets.PROD_API_URL, secrets.API_URL, secrets.BACKEND_URL, vars.NEXT_PUBLIC_API_BASE_URL, vars.PROD_API_URL, vars.API_URL, vars.BACKEND_URL, or set NEXT_PUBLIC_API_BASE_URL/API_URL in .env.production"
                    exit 1
                  fi

                  NORMALIZED_API_URL="${RAW_API_URL%/}"
                  echo "NEXT_PUBLIC_API_BASE_URL=$NORMALIZED_API_URL" >> "$GITHUB_ENV"
              env:
                  RAW_API_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL || secrets.PROD_API_URL || secrets.API_URL || secrets.BACKEND_URL || vars.NEXT_PUBLIC_API_BASE_URL || vars.PROD_API_URL || vars.API_URL || vars.BACKEND_URL }}

            - name: Install and build frontend
              run: |
                  cd frontend
                  npm install --legacy-peer-deps
                  npm run build
