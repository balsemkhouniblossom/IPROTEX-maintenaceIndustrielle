name: Deploy - Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Production Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Validate deployment hooks
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing secrets.BACKEND_DEPLOY_HOOK_URL"
            exit 1
          fi
          if [ -z "$FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "::error::Missing secrets.FRONTEND_DEPLOY_HOOK_URL"
            exit 1
          fi

      - name: Trigger backend deployment
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$BACKEND_DEPLOY_HOOK_URL"

      - name: Trigger frontend deployment
        env:
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$FRONTEND_DEPLOY_HOOK_URL"
