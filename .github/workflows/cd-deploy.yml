name: Deploy - Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Production Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Detect configured deployment targets
        id: hooks
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          BACKEND_RENDER_SERVICE_ID: ${{ secrets.BACKEND_RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$BACKEND_DEPLOY_HOOK_URL" ] || { [ -n "$BACKEND_RENDER_SERVICE_ID" ] && [ -n "$RENDER_API_KEY" ]; }; then
            echo "backend_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend deployment skipped because neither BACKEND_DEPLOY_HOOK_URL nor BACKEND_RENDER_SERVICE_ID + RENDER_API_KEY is configured."
            echo "- Backend deployment skipped: missing deployment target secrets" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$BACKEND_DEPLOY_HOOK_URL" ]; then
            echo "backend_hook_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_hook_configured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$BACKEND_RENDER_SERVICE_ID" ] && [ -n "$RENDER_API_KEY" ]; then
            echo "backend_render_api_configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_render_api_configured=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "frontend_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Frontend deployment skipped because secrets.FRONTEND_DEPLOY_HOOK_URL is not configured."
            echo "- Frontend deployment skipped: missing secrets.FRONTEND_DEPLOY_HOOK_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "frontend_configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger backend deployment
        if: steps.hooks.outputs.backend_configured == 'true'
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          BACKEND_RENDER_SERVICE_ID: ${{ secrets.BACKEND_RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          BACKEND_HOOK_CONFIGURED: ${{ steps.hooks.outputs.backend_hook_configured }}
          BACKEND_RENDER_API_CONFIGURED: ${{ steps.hooks.outputs.backend_render_api_configured }}
        run: |
          if [ "$BACKEND_HOOK_CONFIGURED" = "true" ]; then
            if [ "$BACKEND_RENDER_API_CONFIGURED" = "true" ]; then
              export DEPLOY_HOOK_MAX_ATTEMPTS=2
            fi

            if bash .github/scripts/trigger-deploy-hook.sh "Backend" "$BACKEND_DEPLOY_HOOK_URL"; then
              exit 0
            fi

            if [ "$BACKEND_RENDER_API_CONFIGURED" != "true" ]; then
              echo "::error::Backend deploy hook failed and Render API fallback secrets are not configured."
              echo "- Backend deploy hook failed; no Render API fallback configured" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi

            echo "::warning::Backend deploy hook failed; falling back to Render API deploy."
            echo "- Backend deploy hook failed; trying Render API fallback" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$BACKEND_RENDER_API_CONFIGURED" = "true" ]; then
            bash .github/scripts/trigger-render-deploy-api.sh "Backend" "$BACKEND_RENDER_SERVICE_ID" "$RENDER_API_KEY"
          else
            echo "::error::No backend deployment method is configured."
            exit 1
          fi

      - name: Trigger frontend deployment
        if: steps.hooks.outputs.frontend_configured == 'true'
        env:
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          bash .github/scripts/trigger-deploy-hook.sh "Frontend" "$FRONTEND_DEPLOY_HOOK_URL"

      # Deploy hooks return as soon as Render/Vercel *accept* the trigger,
      # not once the new build is actually live — polling here is what
      # catches a deploy that was accepted but then failed to come up
      # healthy (bad build, crashed boot, wrong env var), instead of
      # finding out from a user report.
      - name: Wait for backend to report healthy
        if: steps.hooks.outputs.backend_configured == 'true'
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL || 'https://pfe-maintenaceindustrielle.onrender.com' }}
        run: |
          cd backend
          npm ci --ignore-scripts
          for attempt in $(seq 1 20); do
            if npm run smoke-test -- --url="$BACKEND_HEALTH_URL"; then
              echo "Backend healthy after $attempt attempt(s)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt/20: backend not healthy yet, retrying in 15s..."
            sleep 15
          done
          echo "::error::Backend never reported healthy at $BACKEND_HEALTH_URL after deployment."
          echo "- Backend post-deploy health check FAILED at $BACKEND_HEALTH_URL" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Wait for frontend to respond
        if: steps.hooks.outputs.frontend_configured == 'true'
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL || 'https://pfe-maintenace-industrielle.vercel.app' }}
        run: |
          for attempt in $(seq 1 20); do
            status=$(curl --location --max-redirs 5 --silent --output /dev/null --write-out "%{http_code}" "$FRONTEND_URL" || true)
            status=${status:-000}
            if [ "$status" = "200" ]; then
              echo "Frontend responded 200 after $attempt attempt(s)." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Attempt $attempt/20: frontend returned $status, retrying in 15s..."
            sleep 15
          done
          echo "::error::Frontend never responded 200 at $FRONTEND_URL after deployment."
          echo "- Frontend post-deploy health check FAILED at $FRONTEND_URL (last status: $status)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
