name: Deploy - Production

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Production Deployments
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment: production
    steps:
      - name: Detect configured deployment hooks
        id: hooks
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$BACKEND_DEPLOY_HOOK_URL" ]; then
            echo "backend_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Backend deployment skipped because secrets.BACKEND_DEPLOY_HOOK_URL is not configured."
            echo "- Backend deployment skipped: missing secrets.BACKEND_DEPLOY_HOOK_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "backend_configured=true" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$FRONTEND_DEPLOY_HOOK_URL" ]; then
            echo "frontend_configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Frontend deployment skipped because secrets.FRONTEND_DEPLOY_HOOK_URL is not configured."
            echo "- Frontend deployment skipped: missing secrets.FRONTEND_DEPLOY_HOOK_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "frontend_configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger backend deployment
        if: steps.hooks.outputs.backend_configured == 'true'
        env:
          BACKEND_DEPLOY_HOOK_URL: ${{ secrets.BACKEND_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$BACKEND_DEPLOY_HOOK_URL"

      - name: Trigger frontend deployment
        if: steps.hooks.outputs.frontend_configured == 'true'
        env:
          FRONTEND_DEPLOY_HOOK_URL: ${{ secrets.FRONTEND_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST "$FRONTEND_DEPLOY_HOOK_URL"
