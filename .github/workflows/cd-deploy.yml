name: CD - Deploy to Production

on:
    push:
        branches: [main]

concurrency:
    group: production-deployment
    cancel-in-progress: false

jobs:
    deploy-backend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: "backend/package-lock.json"

            - name: Install and build backend
              run: |
                  cd backend
                  npm ci
                  npm run build

            - name: Run backend tests
              run: cd backend && npm run test -- --runInBand
              env:
                  NODE_ENV: test

            - name: Build backend Docker image
              run: |
                  docker build -f Dockerfile.backend \
                    -t gmao-backend:${{ github.sha }} \
                    -t gmao-backend:latest \
                    .

            - name: Verify Docker image
              run: docker run --rm gmao-backend:latest node --version

    deploy-frontend:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "22"
                  cache: "npm"
                  cache-dependency-path: "frontend/package-lock.json"

            - name: Resolve frontend API base URL
              run: |
                  read_json_key() {
                    local json_input="$1"
                    local key="$2"
                    JSON_INPUT="$json_input" JSON_KEY="$key" node -e "try{const o=JSON.parse(process.env.JSON_INPUT||'{}');const v=o[process.env.JSON_KEY];if(typeof v==='string'&&v.length)process.stdout.write(v);}catch{}"
                  }

                  RESOLVED_FROM=""
                  RAW_API_URL=""

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$SECRETS_JSON" "NEXT_PUBLIC_API_BASE_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="secret NEXT_PUBLIC_API_BASE_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$SECRETS_JSON" "PROD_API_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="secret PROD_API_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$SECRETS_JSON" "API_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="secret API_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$SECRETS_JSON" "BACKEND_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="secret BACKEND_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$VARS_JSON" "NEXT_PUBLIC_API_BASE_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="var NEXT_PUBLIC_API_BASE_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$VARS_JSON" "PROD_API_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="var PROD_API_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$VARS_JSON" "API_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="var API_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    RAW_API_URL=$(read_json_key "$VARS_JSON" "BACKEND_URL")
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="var BACKEND_URL"
                    fi
                  fi

                  if [ -n "$RAW_API_URL" ]; then
                    RESOLVED_FROM="github secret/variable"
                  fi

                  if [ -z "$RAW_API_URL" ] && [ -f ".env.production" ]; then
                    RAW_API_URL=$(grep -E '^NEXT_PUBLIC_API_BASE_URL=' .env.production | tail -n 1 | cut -d'=' -f2- | tr -d '"' || true)
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM=".env.production NEXT_PUBLIC_API_BASE_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ] && [ -f ".env.production" ]; then
                    RAW_API_URL=$(grep -E '^API_URL=' .env.production | tail -n 1 | cut -d'=' -f2- | tr -d '"' || true)
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM=".env.production API_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ] && [ -f "frontend/.env.example" ]; then
                    RAW_API_URL=$(grep -E '^NEXT_PUBLIC_API_BASE_URL=' frontend/.env.example | tail -n 1 | cut -d'=' -f2- | tr -d '"' || true)
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM="frontend/.env.example NEXT_PUBLIC_API_BASE_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ] && [ -f ".env.example" ]; then
                    RAW_API_URL=$(grep -E '^NEXT_PUBLIC_API_BASE_URL=' .env.example | tail -n 1 | cut -d'=' -f2- | tr -d '"' || true)
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM=".env.example NEXT_PUBLIC_API_BASE_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ] && [ -f ".env.example" ]; then
                    RAW_API_URL=$(grep -E '^API_URL=' .env.example | tail -n 1 | cut -d'=' -f2- | tr -d '"' || true)
                    if [ -n "$RAW_API_URL" ]; then
                      RESOLVED_FROM=".env.example API_URL"
                    fi
                  fi

                  if [ -z "$RAW_API_URL" ]; then
                    echo "::error::Missing frontend API URL. Configure one of: secrets.NEXT_PUBLIC_API_BASE_URL, secrets.PROD_API_URL, secrets.API_URL, secrets.BACKEND_URL, vars.NEXT_PUBLIC_API_BASE_URL, vars.PROD_API_URL, vars.API_URL, vars.BACKEND_URL, or define NEXT_PUBLIC_API_BASE_URL/API_URL in frontend/.env.example, .env.example, or .env.production"
                    exit 1
                  fi

                  NORMALIZED_API_URL="${RAW_API_URL%/}"
                  echo "NEXT_PUBLIC_API_BASE_URL=$NORMALIZED_API_URL" >> "$GITHUB_ENV"
                  echo "Resolved NEXT_PUBLIC_API_BASE_URL from: $RESOLVED_FROM"
              env:
                  SECRETS_JSON: ${{ toJson(secrets) }}
                  VARS_JSON: ${{ toJson(vars) }}

            - name: Install and build frontend
              run: |
                  cd frontend
                  npm install --legacy-peer-deps
                  npm run build
