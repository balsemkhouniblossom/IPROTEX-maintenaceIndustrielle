name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Reject tracked runtime artifacts
        run: node scripts/check-tracked-runtime-artifacts.js

  frontend:
    name: Frontend Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://pfe-maintenaceindustrielle.onrender.com

  backend:
    name: Backend Quality
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:cov -- --runInBand
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/GMAO_IPROTEX_TEST

      - name: Upload coverage for SonarQube
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/lcov.info
          if-no-files-found: error

      - name: Verify MongoDB index definitions are creatable
        run: npm run mongodb:indexes:apply
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/GMAO_IPROTEX_INDEX_CHECK

      - name: Build
        run: npm run build

  sonarqube:
    name: SonarQube Analysis
    needs: [frontend, backend]
    if: ${{ vars.SONAR_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602 # v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  backend-e2e:
    name: Backend E2E
    runs-on: ubuntu-latest
    env:
      MONGOMS_DOWNLOAD_DIR: /tmp/mongodb-binaries
      MONGOMS_VERSION: "8.2.6"
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Cache MongoDB memory server binary
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: ${{ runner.os }}-mongodb-memory-server-8.2.6-${{ hashFiles('backend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-memory-server-8.2.6-

      - name: Install dependencies
        run: npm ci

      - name: E2E tests
        run: npm run test:e2e -- --runInBand
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://127.0.0.1:27017/GMAO_IPROTEX_E2E

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy diagnostic table scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          skip-dirs: node_modules,frontend/node_modules,backend/node_modules,.next,frontend/.next,dist,backend/dist,coverage,frontend/coverage,backend/coverage,backend/uploads,backend/quarantine,backups

      - name: Run Trivy SARIF scan (non-blocking)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: "0"
          skip-dirs: node_modules,frontend/node_modules,backend/node_modules,.next,frontend/.next,dist,backend/dist,coverage,frontend/coverage,backend/coverage,backend/uploads,backend/quarantine,backups

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: trivy-results.sarif
