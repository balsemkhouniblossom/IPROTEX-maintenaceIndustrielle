# Render Blueprint for the GMAO backend (NestJS). See DEPLOYMENT.md for the
# full deployment reference — this file only captures what Render itself
# needs to build and run the service; it does not replace that document.
#
# Applying this (Render dashboard -> New -> Blueprint, pointing at this
# repo) creates the service but does NOT set secret values: every entry
# below uses `sync: false`, which makes Render prompt for the value in its
# dashboard instead of reading one from this file. Nothing here is ever a
# real credential — see DEPLOYMENT.md's env var table for what each one is
# and why it's Render-only.
#
# This describes the backend, the IMS FastAPI service, and production
# Prometheus/Grafana monitoring services. The frontend deploys to Vercel
# (see frontend/vercel.json).
services:
  - type: web
    name: gmao-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: off # deploys are triggered by cd-deploy.yml's deploy hook, not on every push
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_REQUIRE_ATLAS
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 1d
      - key: JWT_PERSISTENT_REFRESH_EXPIRES_IN
        value: 30d
      - key: JWT_SESSION_REFRESH_EXPIRES_IN
        value: 1d
      - key: JWT_REFRESH_COOKIE_MAX_AGE_MS
        value: "2592000000"
      - key: EMAIL_VERIFICATION_SECRET
        sync: false
      - key: GOOGLE_LOGIN_EXCHANGE_ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: FILE_STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        sync: false
      - key: SUPABASE_STORAGE_BUCKET_PUBLIC
        value: "false"
      - key: SUPABASE_SIGNED_URL_EXPIRES_IN_SECONDS
        value: "604800"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_REJECT_UNAUTHORIZED
        value: "true"
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_DELIVERY_MODE
        value: auto
      - key: SMTP_VERIFY_ON_STARTUP
        value: "false"
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: SMTP_GREETING_TIMEOUT_MS
        value: "10000"
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: "15000"
      - key: SMTP_FALLBACK_COOLDOWN_MS
        value: "300000"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_API_URL
        value: https://api.brevo.com/v3/smtp/email
      - key: BREVO_API_TIMEOUT_MS
        value: "10000"
      - key: FORGOT_PASSWORD_ASYNC_EMAIL
        value: "true"
      - key: DEFAULT_LOCALE
        value: en
      - key: ENABLE_LEGACY_EMAIL_TOKENS
        value: "false"
      - key: ENABLE_LEGACY_RESET_TOKENS
        value: "false"
      - key: LEGACY_AUTH_MIGRATION_DEADLINE
        sync: false
      - key: ENABLE_EVENT_BASED_EMAILS
        value: "false"
      - key: ENABLE_EMAIL_DIAGNOSTIC_TEST
        value: "false"
      - key: EMAIL_DIAGNOSTIC_RECIPIENT
        sync: false
      # Optional AI assistant — leave AI_ASSISTANT_ENABLED unset/false unless
      # Gemini access has been approved for this environment (see
      # DEPLOYMENT.md's "Render AI Assistant" section).
      - key: AI_ASSISTANT_ENABLED
        value: "false"
      - key: AI_ASSISTANT_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-lite-latest
      - key: AI_ASSISTANT_TIMEOUT_MS
        value: "12000"
      - key: AI_ASSISTANT_RATE_LIMIT_PER_HOUR
        value: "20"
      # Phase C addition — see main.ts's TimeoutInterceptor.
      - key: REQUEST_TIMEOUT_MS
        value: "30000"
      # Phase F additions — see src/instrument.ts and src/app.module.ts.
      - key: LOG_FORMAT
        value: json
      - key: SLOW_QUERY_THRESHOLD_MS
        value: "200"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: METRICS_BEARER_TOKEN
        sync: false
      - key: BUSINESS_TIMEZONE
        value: Africa/Tunis
      - key: MQTT_BROKER_URL
        sync: false
      - key: TELEMETRY_RETENTION_SECONDS
        value: "604800"
      - key: FAULT_EVENT_RETENTION_SECONDS
        value: "7776000"
      - key: PREDICTIVE_MAINTENANCE_ENABLED
        value: "true"
      - key: PREDICTION_HISTORY_RETENTION_SECONDS
        value: "15552000"
      - key: THROTTLE_ENABLED
        value: "true"
      - key: THROTTLE_DEFAULT_TTL_MS
        value: "60000"
      - key: THROTTLE_DEFAULT_LIMIT
        value: "120"
      - key: THROTTLE_DEVICE_TTL_MS
        value: "60000"
      - key: THROTTLE_DEVICE_LIMIT
        value: "120"
      - key: AUTOMATION_SCHEDULER_ENABLED
        value: "true"
      - key: AUTOMATION_BATCH_SIZE
        value: "100"
      - key: AUTOMATION_CONCURRENCY
        value: "3"
      - key: AUTOMATION_EXTERNAL_CONCURRENCY
        value: "2"
      - key: AUTOMATION_LOCK_TTL_MS
        value: "300000"
      - key: AUTOMATION_LOCK_HEARTBEAT_MS
        value: "30000"
      - key: AUTOMATION_JOB_TIMEOUT_MS
        value: "600000"
      - key: AUTOMATION_MAX_ITEMS_PER_RUN
        value: "1000"
      # IMS anomaly FastAPI integration. Set AI_SERVICE_URL to the deployed
      # gmao-ai-service URL after that service is created.
      - key: AI_SERVICE_ENABLED
        value: "true"
      - key: AI_SERVICE_URL
        sync: false
      - key: AI_SERVICE_TIMEOUT_MS
        value: "12000"
  - type: web
    name: gmao-ai-service
    runtime: python
    rootDir: ai-service
    buildCommand: python -m pip install --upgrade pip && python -m pip install --no-cache-dir -r requirements-runtime.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: off
    disk:
      name: ims-anomaly-artifacts
      mountPath: /var/data/ims-anomaly
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.5"
      - key: AI_SERVICE_ENV
        value: production
      - key: AI_SERVICE_CORS_ORIGINS
        sync: false
      - key: AI_SERVICE_MAX_REQUEST_BYTES
        value: "1048576"
      - key: AI_SERVICE_MAX_BATCH_ROWS
        value: "512"
      - key: IMS_ANOMALY_ARTIFACT_PATH
        value: /var/data/ims-anomaly/artifacts/models/ims_selected_anomaly_model_v0_1_0.joblib
      - key: IMS_ANOMALY_METADATA_PATH
        value: /var/data/ims-anomaly/artifacts/models/ims_selected_anomaly_model_v0_1_0.json
  - type: web
    name: gmao-prometheus
    runtime: docker
    rootDir: monitoring/prometheus
    dockerfilePath: monitoring/prometheus/Dockerfile
    dockerContext: monitoring/prometheus
    disk:
      name: prometheus-data
      mountPath: /prometheus
      sizeGB: 10
    envVars:
      - key: BACKEND_URL
        sync: false
      - key: METRICS_BEARER_TOKEN
        sync: false
      - key: PROMETHEUS_EXTERNAL_URL
        sync: false
  - type: web
    name: gmao-grafana
    runtime: docker
    rootDir: monitoring/grafana
    dockerfilePath: monitoring/grafana/Dockerfile
    dockerContext: monitoring/grafana
    disk:
      name: grafana-data
      mountPath: /var/lib/grafana
      sizeGB: 10
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        sync: false
      - key: GF_SECURITY_ADMIN_USER
        value: admin
      - key: GF_USERS_ALLOW_SIGN_UP
        value: "false"
      - key: GF_AUTH_ANONYMOUS_ENABLED
        value: "false"
      - key: PROMETHEUS_URL
        value: https://gmao-prometheus.onrender.com
