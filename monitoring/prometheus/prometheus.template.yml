global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gmao-backend
    scheme: __BACKEND_SCHEME__
    metrics_path: /health/metrics
    authorization:
      type: Bearer
      credentials_file: /prometheus/secrets/metrics-bearer-token
    static_configs:
      - targets:
          - __BACKEND_TARGET__
        labels:
          service: gmao-backend
          environment: production
